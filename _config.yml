# Site settings
title: "Cadmus NDP Help"
description: "Help documentation for Cadmus Naples Dante Project"
url: "https://fedhlab.github.io/cadmus-ndp-help"
baseurl: "/cadmus-ndp-help"

# Theme
remote_theme: just-the-docs/just-the-docs

# Just the Docs configuration
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
last_edit_timestamp: false

# Color scheme
color_scheme: light

# Navigation and sorting
nav_sort: case_insensitive

# Features
enable_copy_code_button: true

# Plugins
plugins:
  - jekyll-default-layout
  - jekyll-seo-tag
  - jekyll-github-metadata

# Mermaid diagram support
mermaid:
  version: "11.4.1"

# Aux links
aux_links:
  "GitHub Repository": https://github.com/fedhlab/cadmus-ndp-help
